name: Build

on:
  push:
    branches:
      - "main"
  pull_request:
  # 手動執行：不必 push 就能建置。已經跑過的那一次可以用 GitHub 內建的 Re-run 重跑；
  # 還沒有任何 Build 紀錄的 commit（例如沒開 PR 的分支）要靠這個才跑得起來。
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message,'[ci skip]') }}
    outputs:
      github_short_hash: ${{ steps.github_short_hash.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Get github short hash
        id: github_short_hash
        run: echo "result=$(git rev-parse --short "${{ github.sha }}")" >> "$GITHUB_OUTPUT"

  build_linux:
    if: ${{ !contains(github.event.head_commit.message,'[ci skip]') }}
    needs: init
    uses: ./.github/workflows/build_linux.yml
    with:
      version: ${{ needs.init.outputs.github_short_hash }}
  build_windows:
    if: ${{ !contains(github.event.head_commit.message,'[ci skip]') }}
    needs: init
    uses: ./.github/workflows/build_windows.yml
    with:
      version: ${{ needs.init.outputs.github_short_hash }}
  build_macos:
    if: ${{ !contains(github.event.head_commit.message,'[ci skip]') }}
    needs: init
    uses: ./.github/workflows/build_macos.yml
    with:
      version: ${{ needs.init.outputs.github_short_hash }}
