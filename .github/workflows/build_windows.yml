name: Build application (Windows)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # core 的相依套件只支援到 Node 18（更新的版本會在安裝或執行時失敗）
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm install -g yarn
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.50.0"
          cache: true
      - name: Build release
        shell: cmd
        run: |
          call script\build_windows.bat
          rem build_windows.bat 會切換目錄，所以用絕對路徑檢查
          if not exist "%GITHUB_WORKSPACE%\app\assets\better-mcfallout-bot-core.exe" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\app\build\windows\x64\runner\Release\better_mcfallout_bot.exe" exit /b 1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Better-MCFallout-Bot-${{ inputs.version }}-Windows
          path: ${{ github.workspace }}/app/build/windows/x64/runner/Release
          if-no-files-found: error
