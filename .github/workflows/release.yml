name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        type: string
        required: true
      body:
        description: "Release body"
        type: string
        required: false

jobs:
  build_linux:
    uses: ./.github/workflows/build_linux.yml
    with:
      version: ${{ github.event.inputs.version }}
  build_windows:
    uses: ./.github/workflows/build_windows.yml
    with:
      version: ${{ github.event.inputs.version }}
  build_macos:
    uses: ./.github/workflows/build_macos.yml
    with:
      version: ${{ github.event.inputs.version }}

  release:
    needs:
      - build_linux
      - build_windows
      - build_macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        uses: actions/download-artifact@v4

      - name: Zip Windows
        run: zip -r "Better-MCFallout-Bot-${{ github.event.inputs.version }}-Windows.zip" "Better-MCFallout-Bot-${{ github.event.inputs.version }}-Windows"

      - name: Release files
        uses: softprops/action-gh-release@v2
        with:
          name: Better MCFallout Bot ${{ github.event.inputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.body }}
          files: |
            Better-MCFallout-Bot-${{ github.event.inputs.version }}-Linux/Better-MCFallout-Bot-${{ github.event.inputs.version }}-Linux.zip
            Better-MCFallout-Bot-${{ github.event.inputs.version }}-Windows.zip
            Better-MCFallout-Bot-${{ github.event.inputs.version }}-macOS/Better-MCFallout-Bot-${{ github.event.inputs.version }}-macOS.dmg
