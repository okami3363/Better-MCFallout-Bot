name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        type: string
        required: true
      body:
        description: "Release body"
        type: string
        required: false

jobs:
  # 目前只發佈 macOS。Windows 與 Linux 的建置流程還在（build.yml 會跑），
  # 但建出來的程式沒有人實際執行過，所以不放進 Release。
  build_macos:
    uses: ./.github/workflows/build_macos.yml
    with:
      version: ${{ github.event.inputs.version }}
      build_name: ${{ github.event.inputs.version }}

  release:
    needs: build_macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download files
        uses: actions/download-artifact@v4

      # 先建立草稿：確認安裝檔可用後，再到 Releases 頁面按 Publish release。
      # 標籤要指向這次建置的 commit，否則發佈時會指到當時 main 的最新 commit。
      - name: Release files
        uses: softprops/action-gh-release@v2
        with:
          name: Better MCFallout Bot ${{ github.event.inputs.version }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.inputs.body }}
          files: Better-MCFallout-Bot-${{ github.event.inputs.version }}-macOS/Better-MCFallout-Bot-${{ github.event.inputs.version }}-macOS.dmg
