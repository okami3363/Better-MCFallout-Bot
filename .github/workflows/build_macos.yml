name: Build application (macOS)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # app 顯示的版本號；沒給就用 pubspec.yaml 裡的版本
      build_name:
        required: false
        type: string
        default: ""

jobs:
  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # core 的相依套件只支援到 Node 18（更新的版本會在安裝或執行時失敗）
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g yarn
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.50.0"
          cache: true
      # runner 是 Apple Silicon，打包與測試 Intel 版的 core 需要 Rosetta
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Build release
        run: bash script/build_macos.sh "${{ inputs.build_name }}"
      # 用 core 的測試檢查打包好的兩種執行檔都能連線
      - name: Test packaged core
        run: |
          cd core
          CORE_BIN="$PWD/out/better-mcfallout-bot-core-arm64" node --test test/*.test.js
          CORE_BIN="$PWD/out/better-mcfallout-bot-core-x64" node --test test/*.test.js
      - name: Create dmg
        run: |
          cd app/build/macos/Build/Products
          # 只放 app 本身：Release 資料夾裡還有建置過程的中間檔
          mkdir dmg
          ditto Release/better_mcfallout_bot.app dmg/better_mcfallout_bot.app
          assets=dmg/better_mcfallout_bot.app/Contents/Frameworks/App.framework/Versions/A/Resources/flutter_assets/assets
          test -x "$assets/better-mcfallout-bot-core-arm64"
          test -x "$assets/better-mcfallout-bot-core-x64"
          brew install create-dmg
          create-dmg \
          --volname "Better MCFallout Bot Installer (${{ inputs.version }})" \
          --window-pos 200 120 \
          --window-size 800 529 \
          --icon "better_mcfallout_bot.app" 260 250 \
          --hide-extension "better_mcfallout_bot.app" \
          --app-drop-link 540 250 \
          --hdiutil-quiet \
          "Better-MCFallout-Bot-${{ inputs.version }}-macOS.dmg" \
          "dmg/"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Better-MCFallout-Bot-${{ inputs.version }}-macOS
          path: ${{ github.workspace }}/app/build/macos/Build/Products/Better-MCFallout-Bot-${{ inputs.version }}-macOS.dmg
          if-no-files-found: error
